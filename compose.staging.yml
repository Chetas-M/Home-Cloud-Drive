services:
  backend:
    build: ./backend
    container_name: homecloud-stage-api
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - homecloud_stage_storage:/app/storage
      - homecloud_stage_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.staging}
      - FORWARDED_ALLOW_IPS=127.0.0.1,172.30.0.0/24
      - DATABASE_URL=sqlite+aiosqlite:///./data/homecloud.db
      - STORAGE_PATH=/app/storage
      - MAX_STORAGE_BYTES=${MAX_STORAGE_BYTES:-107374182400}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-1073741824}
      - TRASH_AUTO_DELETE_DAYS=${TRASH_AUTO_DELETE_DAYS:-30}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - TWO_FACTOR_TEMP_TOKEN_EXPIRE_MINUTES=${TWO_FACTOR_TEMP_TOKEN_EXPIRE_MINUTES:-10}
      - PASSWORD_RESET_EXPIRE_MINUTES=${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      - SESSION_LAST_SEEN_UPDATE_INTERVAL_SECONDS=${SESSION_LAST_SEEN_UPDATE_INTERVAL_SECONDS:-60}
      - TRUST_PROXY_HEADERS=true
      - CORS_ORIGINS_STR=${CORS_ORIGINS:-http://localhost:3002}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME:-Home Cloud Staging}
      - RESEND_API_URL=${RESEND_API_URL:-https://api.resend.com/emails}
      - RESEND_TIMEOUT_SECONDS=${RESEND_TIMEOUT_SECONDS:-15}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-}
    user: "1000:1000"
    read_only: false
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 192M
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - homecloud_staging_internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homecloud-stage-ui
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "100.126.2.116:3002:80"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    networks:
      - homecloud_staging_internal

volumes:
  homecloud_stage_storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_PATH:-/mnt/homecloud-staging/storage}

  homecloud_stage_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-/mnt/homecloud-staging/data}

networks:
  homecloud_staging_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
